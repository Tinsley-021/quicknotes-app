<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>

  <link rel="stylesheet" href="quicknotes-app_style.css">
  <script src="quicknotes-app_script.js" defer></script>
</head>

<body>

  <header>
    <h1>QuickNotes</h1>
    <p>Write, organise and find your notes easily.</p>
  </header>

  <main>

    <section class="add-section">
      <h2>Add a note</h2>

      <form id="note-form">

        <label for="note-input">Note</label>
        <input
          type="text"
          id="note-input"
          placeholder="Write your note..."
          maxlength="200"
        >

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit">Add Note</button>

      </form>

      <p id="error-message"></p>
    </section>


    <section class="notes-section">
      <h2>Your notes</h2>

      <input
        type="search"
        id="search-input"
        placeholder="Search your notes..."
      >

      <p id="note-count">You have no notes yet.</p>

      <ul id="notes-list"></ul>

      <button type="button" id="clear-all">Clear all</button>
    </section>

  </main>


  <footer>
    <p>QuickNotes &copy; 2026</p>
  </footer>

</body>
</html>
